name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0, 1.1-Pre)"
        required: false
        default: ""
      name:
        description: "Custom pack name (supports Unicode)"
        required: false
        default: ""
      optimize:
        description: "Optimization mode"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - low
          - none

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean old zip files (optional)
        shell: pwsh
        run: Remove-Item *.zip -ErrorAction SilentlyContinue

      - name: Run build script
        shell: pwsh
        run: |
          $params = @{}

          # 处理版本号
          $version = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^v(.+)$') { $version = $Matches[1] }
          }
          if ($version -ne "") {
            $params['v'] = $version
          }

          # 处理包名（仅手动触发）
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $name = "${{ github.event.inputs.name }}"
            if ($name -ne "") {
              $params['n'] = $name   # 中文直接传入，Splatting 保留 Unicode
            }
            
            # 优化选项
            $opt = "${{ github.event.inputs.optimize }}"
            if ($opt -eq "low") {
              $params['l'] = $true
            } elseif ($opt -eq "both") {
              $params['la'] = $true
            }
            # none: 不加优化参数
          } else {
            # push 标签触发：默认 -la
            $params['la'] = $true
          }

          Write-Host "Calling .\build.ps1 with parameters:"
          $params | Format-Table -AutoSize

          & .\build.ps1 @params

      - name: Normalize zip filenames
        shell: pwsh
        run: |
          $name = "${{ github.event.inputs.name }}"
          $version = "${{ github.event.inputs.version }}"
          if (-not $name) { $name = "ResourcePack" }
          if (-not $version) {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^v(.+)$') { $version = $Matches[1] }
            else { $version = (Get-Date -Format "yyyyMMdd-HHmmss") }
          }
          $base = "${name}_v${version}"
          Write-Host "Expected base: $base"
          $zips = Get-ChildItem *.zip
          if ($zips.Count -eq 0) { Write-Error "No zip files found!"; exit 1 }
          foreach ($zip in $zips) {
            if ($zip.Name -notmatch [regex]::Escape($base)) {
              if ($zip.Name -match "Optimized") {
                $newName = "${base}-Optimized.zip"
              } else {
                $newName = "${base}.zip"
              }
              Move-Item $zip.FullName -Destination $newName -Force
              Write-Host "Renamed $($zip.Name) -> $newName"
            }
          }
          Get-ChildItem *.zip | ForEach-Object { Write-Host "Final: $($_.Name)" }

      - name: Upload artifacts (optional, for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: |
            *.zip
          if-no-files-found: error

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
