name: Build and Release

on:
  workflow_dispatch:
    inputs:

      mode:
        name: Build mode
        description: "normal / low / both"
        required: true
        default: "both"
        type: choice
        options:
          - normal
          - low
          - both

      name:
        name: Package name
        description: "Same as build.ps1 -n"
        required: false
        default: ""

      version:
        name: Version
        description: "Same as build.ps1 -v"
        required: false
        default: ""


jobs:

  build:

    runs-on: windows-latest

    permissions:
      contents: write


    steps:


    - name: Checkout
      uses: actions/checkout@v4


    - name: Clean old zip
      shell: pwsh
      run: |
        Remove-Item *.zip -Force -ErrorAction SilentlyContinue


    - name: Run build.ps1
      shell: pwsh
      run: |

        $params = @{}


        switch ("${{ inputs.mode }}") {

          "low" {
            $params["l"] = $true
          }

          "both" {
            $params["la"] = $true
          }

        }


        if ("${{ inputs.name }}" -ne "") {
          $params["n"] = "${{ inputs.name }}"
        }


        if ("${{ inputs.version }}" -ne "") {
          $params["v"] = "${{ inputs.version }}"
        }


        Write-Host "Build parameters:"
        $params | Format-Table


        .\build.ps1 @params



    - name: Check packages
      shell: pwsh
      run: |

        $zips = Get-ChildItem *.zip

        if ($zips.Count -eq 0) {
          throw "No zip generated."
        }

        $zips | ForEach-Object {
          Write-Host $_.Name
        }



    - name: Generate release tag
      id: tag
      shell: pwsh
      run: |

        if ("${{ inputs.version }}" -ne "") {

          $tag = "v${{ inputs.version }}"

        }
        else {

          $tag = "build-" + (Get-Date -Format "yyyyMMdd-HHmmss")

        }


        echo "tag=$tag" >> $env:GITHUB_OUTPUT

        Write-Host "Release tag: $tag"



    - name: Create Draft Release
      uses: softprops/action-gh-release@v2

      with:

        tag_name: ${{ steps.tag.outputs.tag }}

        name: ${{ steps.tag.outputs.tag }}

        draft: true

        generate_release_notes: true

        files: |
          *.zip


      env:

        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}