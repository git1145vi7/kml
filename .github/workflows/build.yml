name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0, 1.1-Pre)'
        required: false
        default: ''
      name:
        description: 'Custom pack name (supports Unicode)'
        required: false
        default: ''
      optimize:
        description: 'Optimization mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - low
          - none

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run build script
        shell: pwsh
        run: |
          # ... 您的构建参数逻辑（保持不变） ...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: |
            *.zip
          if-no-files-found: error

      - name: Create Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: true          # 关键改动
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
