name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0, 1.1-Pre)'
        required: false
        default: ''
      name:
        description: 'Custom pack name (supports Unicode)'
        required: false
        default: ''
      optimize:
        description: 'Optimization mode'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - low
          - none

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build resource pack
        shell: pwsh
        run: |
          $params = @{}

          # ---------- 版本号 ----------
          $version = ""
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVer = "${{ github.event.inputs.version }}".Trim()
            if ($rawVer -ne "") {
              # 如果你希望版本号不附加额外后缀，可以只用原始值，但会导致tag重复
              # 这里保留原始值传给 -v，但 tag 我们另行处理
              $version = $rawVer
            }
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^v(.+)$') { $version = $Matches[1] }
          }
          if ($version -ne "") { $params['v'] = $version }

          # ---------- 包名 (去除换行和空格) ----------
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawName = "${{ github.event.inputs.name }}"
            $name = ($rawName -replace "`r|`n", "").Trim()
            if ($name -ne "") { $params['n'] = $name }
          }

          # ---------- 优化选项 ----------
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $opt = "${{ github.event.inputs.optimize }}"
            switch ($opt) {
              "low"  { $params['l'] = $true }
              "both" { $params['la'] = $true }
              "none" { }  # 不加优化参数
            }
          } else {
            $params['la'] = $true   # 推送标签时默认 both
          }

          Write-Host "=== Final parameters ==="
          $params | Format-Table -AutoSize

          & .\build.ps1 @params

      - name: Upload artifacts (for debug)
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: |
            *.zip
          if-no-files-found: error

      - name: Create Release (unique tag for manual runs)
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发：用输入版本+构建号生成唯一tag；推送标签则直接用原tag
          tag_name: ${{ 
            github.event_name == 'workflow_dispatch' && 
            format('v{0}-build.{1}', github.event.inputs.version, github.run_number) || 
            github.ref_name 
          }}
          name: "Release ${{ 
            github.event_name == 'workflow_dispatch' && 
            github.event.inputs.version || 
            github.ref_name 
          }}"
          draft: true
          generate_release_notes: true
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}